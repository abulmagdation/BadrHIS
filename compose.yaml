# Local Docker preview. Cloud Run uses Dockerfile and an external MongoDB.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: badr_his_docker
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongo-data:
